name: prism-example-momentic
include:
  - '**/*.test.yaml'
  - '**/*.module.yaml'
fileFormat: v2
recordVideo: on-fail
retries: 0
parallel: 1
environments:
  - name: web
    baseUrl: ${PRISM_SANDBOX_URL}
gitMainBranch: main
ai:
  useMemory: true
  failureRecovery: true
  classification:
    enabled: true
    overrideExitCode: false
  agentConfig:
    locator: v5
    assertion: v5
    visual-assertion: v4.0
    text-extraction: v3.0
    failure-recovery: v2.1
browser:
  disableSecondaryCacheResolution: true
  autoExpandIframes: true
